# Rebuilds and publishes the site:
#  - whenever something is changed in the repository
#  - automatically every night (refreshes news, place lists and the exchange rate)
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # every day, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refresh news, places and exchange rate
        run: npm run update-data

      # Saving the fresh data also counts as repository activity, which stops
      # GitHub from pausing the nightly schedule after 60 quiet days.
      - name: Save refreshed data
        run: |
          git config user.name "indiawijzer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/_data/*.json
          git diff --cached --quiet || git commit -m "Automatic data update"
          # Not essential: if saving fails (e.g. two runs at once) the site is still published.
          git push || echo "Could not save data this time; will try again at the next run."

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
